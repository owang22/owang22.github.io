- group: "Current research"
  title: "Robot memory on a real quadruped"
  period: "Sep 2026 – now · NESL · Unitree Go2"
  question: "What breaks when a routine-aware memory leaves simulation and runs on a real robot?"
  summary: "I deployed our memory system on a Unitree Go2, built memories from 3,000+ robot images, and compared five memory designs. Real-world failures that never showed up in simulation included inconsistent scene descriptions, localization drift that corrupted stored observations, and memories that could not represent something being absent. I also built an agent that diagnoses robot failures from tool-call and sensor logs."

- group: "Current research"
  title: "Home robot memory when routines change"
  period: "Jun 2026 – now · NESL · CoRL 2026 workshops"
  question: "When people start keeping things in new places, how should a home robot update what it remembers?"
  summary: "I built a ten-household object-search benchmark where routines change without warning. LLM-written memory summaries often fail to reuse what they learned when an earlier routine comes back. My memory-update method keeps hypotheses about the underlying routines and uses a retrieval tool to check them against raw observations, which improves predictions during these shifts, especially recurring ones."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2611.29818"
    - label: "code"
      url: "https://github.com/nesl/memory-for-home-robots"

- group: "Current research"
  title: "Confidence after a routine shift"
  period: "Jun 2026 – now · NESL · CoRL 2026 workshops"
  question: "After someone's routine shifts, does a predictor's confidence still tell you when it is wrong?"
  summary: "I compared LLM self-reported confidence with ensemble uncertainty after routine changes. LLM confidence is poorly calibrated, but it keeps a ~0.3 correlation with correctness while the baselines fall to about zero."

- group: "Current research"
  title: "Finding events in cameras, sensors, and text"
  period: "Jan 2026 – now · with Sandia National Labs"
  question: "Can an agent keep revising what it believes is happening as evidence about an unfolding event arrives?"
  summary: "I lead the research direction of this UCLA–Sandia collaboration. I proposed a knowledge-graph-based agent that maintains and revises hypotheses about urban events, like wildfires and traffic accidents, as evidence comes in from cameras, sensors, and social media. I'm now building a version that refines its own memory from detection outcomes, together with a master's student I recruited to the project."

- group: "Current research"
  title: "Alzheimer's detection from speech"
  period: "Sep 2026 – now · SPAPL, UCLA (Prof. Abeer Alwan)"
  question: "Can the confidence and disagreement of speech recognizers help detect Alzheimer's disease?"
  summary: "I'm using calibrated confidence and disagreement across multiple speech recognizers as features for detecting Alzheimer's disease from picture-description recordings, and developing an agentic method that uses clinical knowledge to choose between feature types when there are very few training samples."

- group: "Current research"
  title: "Human feedback for a time-series benchmark"
  period: "Dec 2025 – now · NESL"
  question: "How do you check that a synthetic dataset teaches a time-series model the right things?"
  summary: "I built a review pipeline where 10 annotators went through 1,000 questions, and worked with the lead researcher to fix ambiguous tasks, questions, and labels in a synthetic dataset of 10,000+ samples for training a general-purpose time-series foundation model."

- group: "Current research"
  title: "Spectral predictability"
  period: "Jan 2024 – Dec 2025 · NESL · AAAI 2026 AI4TS workshop, oral"
  question: "Before running a large forecasting model, can you tell whether it will beat a small one?"
  summary: "A spectral predictability score takes seconds to compute. Across 51 models and 28 datasets, foundation models had 20–60% lower error than lightweight forecasters on data the score rated as predictable."
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2511.08884"
    - label: "code"
      url: "https://github.com/nesl/Spectral-Predictability-TS"

- group: "Earlier research"
  title: "Robots reading recipes"
  period: "Summer 2023 · Cross Labs, Kyoto"
  question: "Can an off-the-shelf language model turn a written recipe into code a robot can run?"
  summary: "Working with cocktail recipes and no fine-tuning, I combined line-by-line prompting, ensemble voting, and verb parsing to reach 0.75 accuracy. I also wrote feasibility reports for industry clients."
  links:
    - label: "paper"
      url: "https://link.springer.com/article/10.1007/s10015-025-01031-3"

- group: "Earlier research"
