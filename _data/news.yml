  text: "Started my M.S. in EE at UCLA, staying in NESL, where I'm now taking our robot memory work onto a Unitree Go2 quadruped. Also joined Prof. Abeer Alwan's speech lab (SPAPL) to work on Alzheimer's disease detection from speech."
- date: "Summer 2026"
  text: "Volunteer TA at UCLA COSMOS, teaching high schoolers computer vision, speech, and AI."
- date: "Jun 2026"
  text: "Finished my B.S. in Electrical Engineering at UCLA, *summa cum laude*. Also started a part-time research internship at Archband Labs on blood pressure estimation from wearable PPG signals."
- date: "2026"
